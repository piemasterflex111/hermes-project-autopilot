name: Mobile shortcuts replay
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify mobile release metadata
        run: python3 scripts/verify_mobile_shortcuts_release.py
      - name: Replay full 40-patch series
        run: ./scripts/replay_mobile_shortcuts_release.sh /tmp/hermes-autopilot-mobile-r4
